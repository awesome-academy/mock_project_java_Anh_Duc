<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body>

  <div th:fragment="pagination(page, baseUrl, queryParams, entityName)">

    <div th:if="${page.totalPages > 1}" class="d-flex justify-content-between align-items-center mt-3">

      <div>
        <span class="text-muted">
          Showing <span th:text="${page.numberOfElements}"></span>
          of <span th:text="${page.totalElements}"></span>
          <span th:text="${entityName}"></span>
        </span>
      </div>

      <nav aria-label="Page navigation">
        <ul class="pagination mb-0">

          <li class="page-item" th:classappend="${page.number == 0} ? 'disabled'">
            <a class="page-link" th:href="@{${baseUrl}(page=${page.number - 1})} + ${queryParams}"
              aria-label="Previous">
              <span aria-hidden="true">&laquo;</span>
            </a>
          </li>

          <li class="page-item" th:if="${page.number > 2}">
            <a class="page-link" th:href="@{${baseUrl}(page=0)} + ${queryParams}">1</a>
          </li>

          <li class="page-item disabled" th:if="${page.number > 3}">
            <span class="page-link">...</span>
          </li>

          <th:block th:each="i : ${#numbers.sequence(0, page.totalPages - 1)}">
            <li class="page-item" th:if="${i >= page.number - 2 && i <= page.number + 2}"
              th:classappend="${i == page.number} ? 'active'">
              <a class="page-link" th:href="@{${baseUrl}(page=${i})} + ${queryParams}" th:text="${i + 1}"></a>
            </li>
          </th:block>

          <li class="page-item disabled" th:if="${page.number < page.totalPages - 4}">
            <span class="page-link">...</span>
          </li>

          <li class="page-item" th:if="${page.number < page.totalPages - 3}">
            <a class="page-link" th:href="@{${baseUrl}(page=${page.totalPages - 1})} + ${queryParams}"
              th:text="${page.totalPages}"></a>
          </li>

          <li class="page-item" th:classappend="${page.number >= page.totalPages - 1} ? 'disabled'">
            <a class="page-link" th:href="@{${baseUrl}(page=${page.number + 1})} + ${queryParams}" aria-label="Next">
              <span aria-hidden="true">&raquo;</span>
            </a>
          </li>
        </ul>
      </nav>
    </div>
  </div>

</body>

</html>
