<html lang="en" xmlns:th="http://www.thymeleaf.org">
<ul class="navbar-nav bg-gradient-primary sidebar sidebar-dark accordion" id="accordionSidebar" th:fragment="sidebar">
  <a class="sidebar-brand d-flex align-items-center justify-content-center" href="#" th:href="@{/admin/dashboard}">
    <div class="sidebar-brand-icon rotate-n-15">
      <i class="fas fa-laugh-wink"></i>
    </div>
    <div class="sidebar-brand-text mx-3">SB Admin <sup>2</sup></div>
  </a>

  <hr class="sidebar-divider my-0">

  <li class="nav-item active">
    <a class="nav-link" href="#" th:href="@{/dashboard}">
      <i class="fas fa-fw fa-tachometer-alt"></i>
      <span>Dashboard</span></a>
  </li>

  <hr class="sidebar-divider d-none d-md-block">

  <!-- Breadcrumbs -->
  <li th:each="breadcrumb : ${breadcrumbs}" class="nav-item">
    <a class="nav-link" href="#" th:href="${breadcrumb.url}">
      <i class="fas fa-fw" th:class="${breadcrumb.icon}"></i>
      <span th:text="${breadcrumb.label}"></span></a>
  </li>

  <div class="text-center d-none d-md-inline">
    <button class="rounded-circle border-0" id="sidebarToggle"></button>
  </div>
</ul>

</html>
