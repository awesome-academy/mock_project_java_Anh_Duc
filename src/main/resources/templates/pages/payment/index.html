<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layout/base}">

<head>
  <title layout:title-append=" | Payment Management"></title>
  <th:block layout:fragment="custom-css">
  </th:block>
</head>

<body>

  <th:block layout:fragment="content">

    <div class="d-sm-flex align-items-center justify-content-between mb-4">
      <h1 class="h3 mb-0 text-gray-800">Payment Management</h1>
    </div>

    <!-- Search and Filter Form -->
    <div class="card shadow mb-4">
      <div class="card-body">
        <form th:action="@{/admin/payments}" method="get" class="form-inline">
          <div class="form-group mr-3 mb-2">
            <label for="keyword" class="mr-2">Search:</label>
            <input type="text" class="form-control" id="keyword" name="keyword" th:value="${keyword}"
              placeholder="Search by transaction ID, booking code, user..." style="min-width: 300px;">
          </div>
          <div class="form-group mr-3 mb-2">
            <label for="status" class="mr-2">Status:</label>
            <select class="form-control" id="status" name="status">
              <option value="">All Status</option>
              <option th:each="paymentStatus : ${paymentStatuses}" th:value="${paymentStatus}"
                th:text="${paymentStatus}" th:selected="${filterStatus != null && filterStatus == paymentStatus}">
              </option>
            </select>
          </div>
          <button type="submit" class="btn btn-primary mb-2 mr-2">
            <i class="fas fa-search"></i> Search
          </button>
          <a th:href="@{/admin/payments}" class="btn btn-secondary mb-2">
            <i class="fas fa-undo"></i> Reset
          </a>
        </form>
      </div>
    </div>

    <!-- Alert Messages -->
    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
      <i class="fas fa-check-circle"></i>
      <span th:text="${successMessage}"></span>
      <button type="button" class="close" data-dismiss="alert" aria-label="Close">
        <span aria-hidden="true">&times;</span>
      </button>
    </div>

    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
      <i class="fas fa-exclamation-triangle"></i>
      <span th:text="${errorMessage}"></span>
      <button type="button" class="close" data-dismiss="alert" aria-label="Close">
        <span aria-hidden="true">&times;</span>
      </button>
    </div>

    <div class="row">
      <div class="col-12">
        <div class="card shadow mb-4">
          <div class="card-header py-3">
            <h6 class="m-0 font-weight-bold text-primary">List Payments</h6>
          </div>
          <div class="card-body">
            <div class="table-responsive">
              <table class="table table-bordered table-hover" id="paymentTable" width="100%" cellspacing="0">
                <thead>
                  <tr class="bg-light">
                    <th>ID</th>
                    <th>Transaction ID</th>
                    <th>User</th>
                    <th>Booking Code</th>
                    <th>Tour</th>
                    <th>Amount</th>
                    <th>Payment Method</th>
                    <th>Status</th>
                    <th>Created At</th>
                    <th>Actions</th>
                  </tr>
                </thead>
                <tbody>
                  <tr th:each="payment : ${payments}">
                    <td th:text="${payment.id}"></td>
                    <td>
                      <strong th:text="${payment.transactionId}"></strong>
                    </td>
                    <td>
                      <div>
                        <i class="fas fa-user"></i> <span th:text="${payment.username}"></span>
                      </div>
                      <div class="text-muted small">
                        <i class="fas fa-envelope"></i> <span th:text="${payment.userEmail}"></span>
                      </div>
                    </td>
                    <td>
                      <a th:href="@{/admin/bookings/edit/{id}(id=${payment.bookingId})}"
                        th:text="${payment.bookingCode}" class="text-primary font-weight-bold"></a>
                    </td>
                    <td th:text="${payment.tourName}"></td>
                    <td>
                      <strong th:text="${#numbers.formatDecimal(payment.amount, 0, 'COMMA', 0, 'POINT')}"></strong> VND
                    </td>
                    <td>
                      <span th:if="${payment.paymentMethod != null}" th:text="${payment.paymentMethod.label}"
                        th:classappend="${payment.paymentMethod.badgeClass}" class="badge">
                        <i th:classappend="${payment.paymentMethod.icon}"></i>
                      </span>
                      <span th:unless="${payment.paymentMethod != null}" class="badge badge-secondary">N/A</span>
                    </td>
                    <td>
                      <span th:if="${payment.status != null}" th:text="${payment.status.label}"
                        th:classappend="${payment.status.badgeClass}" class="badge">
                        <i th:classappend="${payment.status.icon}"></i>
                      </span>
                      <span th:unless="${payment.status != null}" class="badge badge-secondary">N/A</span>
                    </td>
                    <td th:text="${#temporals.format(payment.createdAt, 'dd/MM/yyyy HH:mm')}"></td>
                    <td>
                      <a th:href="@{/admin/payments/detail/{id}(id=${payment.id})}" class="btn btn-sm btn-info mb-1">
                        <i class="fas fa-eye"></i> Detail
                      </a>

                      <!-- Status Update Dropdown -->
                      <div class="dropdown d-inline">
                        <button class="btn btn-sm btn-warning dropdown-toggle mb-1" type="button"
                          th:id="'statusDropdown' + ${payment.id}" data-toggle="dropdown" aria-haspopup="true"
                          aria-expanded="false">
                          <i class="fas fa-sync-alt"></i> Status
                        </button>
                        <div class="dropdown-menu" th:aria-labelledby="'statusDropdown' + ${payment.id}">
                          <form th:action="@{/admin/payments/update-status/{id}(id=${payment.id})}" method="post">
                            <button th:each="status : ${paymentStatuses}" type="submit" name="status"
                              th:value="${status}" class="dropdown-item">
                              <span class="badge" th:classappend="${status.badgeClass}" th:text="${status.label}">
                                <i th:classappend="${status.icon}"></i>
                              </span>
                            </button>
                          </form>
                        </div>
                      </div>

                      <div class="d-inline">
                        <form th:action="@{/admin/payments/delete/{id}(id=${payment.id})}" method="post"
                          class="d-inline" onsubmit="return confirm('Do you want to delete this payment?');">
                          <button type="submit" class="btn btn-sm btn-danger mb-1">
                            <i class="fas fa-trash"></i> Delete
                          </button>
                        </form>
                      </div>
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>

            <!-- Empty State -->
            <div th:if="${#lists.isEmpty(payments)}" class="text-center py-5">
              <i class="fas fa-inbox fa-3x text-muted mb-3"></i>
              <p class="text-muted">No payments found.</p>
            </div>
          </div>
        </div>
      </div>
    </div>

  </th:block>

  <th:block layout:fragment="custom-scripts">
  </th:block>

</body>

</html>
