<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layout/base}">

<head>
  <title layout:title-append=" | Review Management"></title>
  <th:block layout:fragment="custom-css">
    <style>
      .review-content {
        max-width: 400px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .rating-stars {
        color: #f39c12;
      }
    </style>
  </th:block>
</head>

<body>

  <th:block layout:fragment="content">

    <div class="d-sm-flex align-items-center justify-content-between mb-4">
      <h1 class="h3 mb-0 text-gray-800">Review Management</h1>
    </div>

    <!-- Search Form -->
    <div class="card shadow mb-4">
      <div class="card-body">
        <form th:action="@{/admin/reviews}" method="get" class="form-inline">
          <div class="form-group mr-3 mb-2">
            <label for="keyword" class="mr-2">Search:</label>
            <input type="text" class="form-control" id="keyword" name="keyword" th:value="${keyword}"
              placeholder="Search by content, user name, or email" style="min-width: 350px;">
          </div>
          <button type="submit" class="btn btn-primary mb-2 mr-2">
            <i class="fas fa-search"></i> Search
          </button>
          <a th:href="@{/admin/reviews}" class="btn btn-secondary mb-2">
            <i class="fas fa-undo"></i> Reset
          </a>
        </form>
      </div>
    </div>

    <!-- Alert Messages -->
    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
      <i class="fas fa-check-circle"></i>
      <span th:text="${successMessage}"></span>
      <button type="button" class="close" data-dismiss="alert" aria-label="Close">
        <span aria-hidden="true">&times;</span>
      </button>
    </div>

    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
      <i class="fas fa-exclamation-triangle"></i>
      <span th:text="${errorMessage}"></span>
      <button type="button" class="close" data-dismiss="alert" aria-label="Close">
        <span aria-hidden="true">&times;</span>
      </button>
    </div>

    <div class="row">
      <div class="col-12">
        <div class="card shadow mb-4">
          <div class="card-header py-3">
            <h6 class="m-0 font-weight-bold text-primary">List Reviews</h6>
          </div>
          <div class="card-body">
            <div class="table-responsive">
              <table class="table table-bordered table-hover" id="reviewTable" width="100%" cellspacing="0">
                <thead>
                  <tr class="bg-light">
                    <th>ID</th>
                    <th>User</th>
                    <th>Type</th>
                    <th>Rating</th>
                    <th>Content</th>
                    <th>Status</th>
                    <th>Created</th>
                    <th>Actions</th>
                  </tr>
                </thead>
                <tbody>
                  <tr th:each="review : ${reviews}">
                    <td th:text="${review.id}"></td>
                    <td>
                      <div th:text="${review.userName}"></div>
                      <small class="text-muted" th:text="${review.userEmail}"></small>
                    </td>
                    <td>
                      <span th:if="${review.reviewableType.name() == 'TOUR'}" class="badge badge-info">Tour</span>
                      <span th:if="${review.reviewableType.name() == 'BOOKING'}" class="badge badge-primary">Booking</span>
                      <span th:if="${review.reviewableType.name() == 'ARTICLE'}" class="badge badge-secondary">Article</span>
                      <div class="text-muted small">ID: <span th:text="${review.reviewableId}"></span></div>
                    </td>
                    <td>
                      <span class="rating-stars">
                        <span th:each="i : ${#numbers.sequence(1, review.rating)}">★</span>
                        <span th:each="i : ${#numbers.sequence(review.rating + 1, 5)}">☆</span>
                      </span>
                      <div class="small text-muted" th:text="${review.rating} + '/5'"></div>
                    </td>
                    <td>
                      <div class="review-content" th:text="${review.content}" th:title="${review.content}"></div>
                    </td>
                    <td>
                      <span th:if="${review.status.name() == 'PENDING'}" class="badge badge-warning">Pending</span>
                      <span th:if="${review.status.name() == 'APPROVED'}" class="badge badge-success">Approved</span>
                      <span th:if="${review.status.name() == 'REJECTED'}" class="badge badge-danger">Rejected</span>
                      <span th:if="${review.status.name() == 'HIDDEN'}" class="badge badge-secondary">Hidden</span>
                    </td>
                    <td>
                      <span th:text="${#temporals.format(review.createdAt, 'dd/MM/yyyy HH:mm')}"></span>
                    </td>
                    <td>
                      <div class="btn-group-vertical btn-group-sm" role="group">
                        <a th:href="@{/admin/reviews/edit/{id}(id=${review.id})}" class="btn btn-sm btn-info mb-1">
                          <i class="fas fa-edit"></i> Edit
                        </a>

                        <form th:if="${review.status.name() != 'APPROVED'}"
                              th:action="@{/admin/reviews/approve/{id}(id=${review.id})}"
                              method="post" class="d-inline mb-1">
                          <button type="submit" class="btn btn-sm btn-success btn-block">
                            <i class="fas fa-check"></i> Approve
                          </button>
                        </form>

                        <form th:if="${review.status.name() != 'REJECTED'}"
                              th:action="@{/admin/reviews/reject/{id}(id=${review.id})}"
                              method="post" class="d-inline mb-1">
                          <button type="submit" class="btn btn-sm btn-warning btn-block">
                            <i class="fas fa-times"></i> Reject
                          </button>
                        </form>

                        <form th:if="${review.status.name() != 'HIDDEN'}"
                              th:action="@{/admin/reviews/hide/{id}(id=${review.id})}"
                              method="post" class="d-inline mb-1">
                          <button type="submit" class="btn btn-sm btn-secondary btn-block">
                            <i class="fas fa-eye-slash"></i> Hide
                          </button>
                        </form>

                        <form th:action="@{/admin/reviews/delete/{id}(id=${review.id})}"
                              method="post" class="d-inline"
                              onsubmit="return confirm('Are you sure you want to delete this review?');">
                          <button type="submit" class="btn btn-sm btn-danger btn-block">
                            <i class="fas fa-trash"></i> Delete
                          </button>
                        </form>
                      </div>
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
  </th:block>

  <th:block layout:fragment="custom-scripts">
  </th:block>

</body>

</html>
