<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layout/base}">

<head>
  <title layout:title-append=" | Create Category"></title>
  <th:block layout:fragment="custom-css">
  </th:block>
</head>

<body>

  <th:block layout:fragment="content">

    <div class="d-sm-flex align-items-center justify-content-between mb-4">
      <h1 class="h3 mb-0 text-gray-800">Create New Category</h1>
      <a th:href="@{/admin/categories}" class="btn btn-secondary btn-icon-split">
        <span class="icon text-white-50">
          <i class="fas fa-arrow-left"></i>
        </span>
        <span class="text">Back to List</span>
      </a>
    </div>

    <!-- Alert Messages -->
    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
      <i class="fas fa-check-circle"></i>
      <span th:text="${successMessage}"></span>
      <button type="button" class="close" data-dismiss="alert" aria-label="Close">
        <span aria-hidden="true">&times;</span>
      </button>
    </div>

    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
      <i class="fas fa-exclamation-triangle"></i>
      <span th:text="${errorMessage}"></span>
      <button type="button" class="close" data-dismiss="alert" aria-label="Close">
        <span aria-hidden="true">&times;</span>
      </button>
    </div>

    <!-- Create Category Form -->
    <div class="row">
      <div class="col-lg-8 offset-lg-2">
        <div class="card shadow mb-4">
          <div class="card-header py-3">
            <h6 class="m-0 font-weight-bold text-primary">Category Information</h6>
          </div>
          <div class="card-body">
            <form th:action="@{/admin/categories/create}" th:object="${formCreateCategoryDTO}" method="post">

              <!-- Category Name -->
              <div class="form-group">
                <label for="name">Category Name <span class="text-danger">*</span></label>
                <input type="text" class="form-control" id="name" th:field="*{name}"
                  th:classappend="${#fields.hasErrors('name')} ? 'is-invalid' : ''" placeholder="Enter category name">
                <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                <small class="form-text text-muted">Enter a unique name for the category (3-100 characters)</small>
              </div>

              <!-- Slug -->
              <div class="form-group">
                <label for="slug">Slug <span class="text-danger">*</span></label>
                <input type="text" class="form-control" id="slug" th:field="*{slug}"
                  th:classappend="${#fields.hasErrors('slug')} ? 'is-invalid' : ''"
                  placeholder="Enter slug (e.g., beach-tours)">
                <div class="invalid-feedback" th:if="${#fields.hasErrors('slug')}" th:errors="*{slug}"></div>
                <small class="form-text text-muted">URL-friendly version of the name (e.g., beach-tours,
                  city-tours)</small>
              </div>

              <!-- Description -->
              <div class="form-group">
                <label for="description">Description <span class="text-danger">*</span></label>
                <textarea class="form-control" id="description" th:field="*{description}"
                  th:classappend="${#fields.hasErrors('description')} ? 'is-invalid' : ''" rows="5"
                  placeholder="Enter category description"></textarea>
                <div class="invalid-feedback" th:if="${#fields.hasErrors('description')}" th:errors="*{description}">
                </div>
                <small class="form-text text-muted">Provide a detailed description (10-500 characters)</small>
              </div>

              <!-- Submit Button -->
              <div class="form-group mt-4">
                <button type="submit" class="btn btn-primary btn-icon-split">
                  <span class="icon text-white-50">
                    <i class="fas fa-save"></i>
                  </span>
                  <span class="text">Create Category</span>
                </button>
                <a th:href="@{/admin/categories}" class="btn btn-secondary ml-2">
                  <i class="fas fa-times"></i> Cancel
                </a>
              </div>

            </form>
          </div>
        </div>
      </div>
    </div>

  </th:block>

  <th:block layout:fragment="custom-scripts">
    <script th:src="@{/js/helpers/slug.js}"></script>
  </th:block>

</body>

</html>
