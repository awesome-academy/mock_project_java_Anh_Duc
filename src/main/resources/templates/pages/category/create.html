<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layout/base}">

<head>
  <title layout:title-append=" | Create Category"></title>
  <th:block layout:fragment="custom-css">
  </th:block>
</head>

<body>

  <th:block layout:fragment="content">

    <div class="d-sm-flex align-items-center justify-content-between mb-4">
      <h1 class="h3 mb-0 text-gray-800">Create New Category</h1>
      <a th:href="@{/admin/categories}" class="btn btn-secondary btn-icon-split">
        <span class="icon text-white-50">
          <i class="fas fa-arrow-left"></i>
        </span>
        <span class="text">Back to List</span>
      </a>
    </div>

    <!-- Alert Messages -->
    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
      <i class="fas fa-check-circle"></i>
      <span th:text="${successMessage}"></span>
      <button type="button" class="close" data-dismiss="alert" aria-label="Close">
        <span aria-hidden="true">&times;</span>
      </button>
    </div>

    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
      <i class="fas fa-exclamation-triangle"></i>
      <span th:text="${errorMessage}"></span>
      <button type="button" class="close" data-dismiss="alert" aria-label="Close">
        <span aria-hidden="true">&times;</span>
      </button>
    </div>

    <form th:action="@{/admin/categories/create}" th:object="${formCreateCategoryDTO}" method="post">

      <!-- Section 1: Basic Information -->
      <div class="card shadow mb-4">
        <div class="card-header py-3 bg-gradient-primary">
          <h6 class="m-0 font-weight-bold text-white">
            <i class="fas fa-folder-open"></i> Category Information
          </h6>
        </div>
        <div class="card-body">
          <div class="row">
            <div class="col-md-6">
              <!-- Category Name -->
              <div class="form-group">
                <label for="name" class="font-weight-bold">
                  <i class="fas fa-tag text-primary"></i> Category Name <span class="text-danger">*</span>
                </label>
                <input type="text" class="form-control" id="name" th:field="*{name}"
                  th:classappend="${#fields.hasErrors('name')} ? 'is-invalid' : ''"
                  placeholder="e.g., Beach Tours">
                <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                <small class="form-text text-muted">Unique category name (3-100 characters)</small>
              </div>
            </div>

            <div class="col-md-6">
              <!-- Slug -->
              <div class="form-group">
                <label for="slug" class="font-weight-bold">
                  <i class="fas fa-link text-primary"></i> URL Slug <span class="text-danger">*</span>
                </label>
                <input type="text" class="form-control" id="slug" th:field="*{slug}"
                  th:classappend="${#fields.hasErrors('slug')} ? 'is-invalid' : ''"
                  placeholder="beach-tours">
                <div class="invalid-feedback" th:if="${#fields.hasErrors('slug')}" th:errors="*{slug}"></div>
                <small class="form-text text-muted">URL-friendly version (lowercase, hyphens only)</small>
              </div>
            </div>
          </div>

          <div class="row">
            <div class="col-12">
              <!-- Description -->
              <div class="form-group">
                <label for="description" class="font-weight-bold">
                  <i class="fas fa-align-left text-primary"></i> Description <span class="text-danger">*</span>
                </label>
                <textarea class="form-control" id="description" th:field="*{description}"
                  th:classappend="${#fields.hasErrors('description')} ? 'is-invalid' : ''" rows="6"
                  placeholder="Provide a detailed description of this category..."></textarea>
                <div class="invalid-feedback" th:if="${#fields.hasErrors('description')}" th:errors="*{description}">
                </div>
                <small class="form-text text-muted">Detailed description (10-500 characters)</small>
              </div>
            </div>
          </div>

          <div class="alert alert-info mt-2">
            <i class="fas fa-info-circle"></i> <strong>Tip:</strong> The slug will be automatically generated from the category name. You can customize it if needed.
          </div>
        </div>
      </div>

      <!-- Submit Buttons -->
      <div class="card shadow mb-4">
        <div class="card-body bg-light">
          <div class="text-center">
            <button type="submit" class="btn btn-primary btn-lg btn-icon-split px-5">
              <span class="icon text-white-50">
                <i class="fas fa-save"></i>
              </span>
              <span class="text">Create Category</span>
            </button>
            <a th:href="@{/admin/categories}" class="btn btn-secondary btn-lg ml-3 px-5">
              <i class="fas fa-times"></i> Cancel
            </a>
          </div>
        </div>
      </div>

    </form>

  </th:block>

  <th:block layout:fragment="custom-scripts">
  </th:block>

</body>

</html>
