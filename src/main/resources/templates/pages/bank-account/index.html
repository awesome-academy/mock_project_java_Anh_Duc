<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layout/base}">

<head>
  <title layout:title-append=" | Bank Account Management"></title>
  <th:block layout:fragment="custom-css">
  </th:block>
</head>

<body>

  <th:block layout:fragment="content">

    <div class="d-sm-flex align-items-center justify-content-between mb-4">
      <h1 class="h3 mb-0 text-gray-800">Bank Account Management</h1>
      <a th:href="@{/admin/bank-accounts/create}" class="btn btn-primary">
        <i class="fas fa-plus"></i> Add New Account
      </a>
    </div>

    <!-- Search and Filter Form -->
    <div class="card shadow mb-4">
      <div class="card-body">
        <form th:action="@{/admin/bank-accounts}" method="get" class="form-inline">
          <div class="form-group mr-3 mb-2">
            <label for="keyword" class="mr-2">Search:</label>
            <input type="text" class="form-control" id="keyword" name="keyword" th:value="${keyword}"
              placeholder="Search by bank name, account number, holder..." style="min-width: 300px;">
          </div>
          <div class="form-group mr-3 mb-2">
            <label for="isActive" class="mr-2">Status:</label>
            <select class="form-control" id="isActive" name="isActive">
              <option value="">All</option>
              <option value="true" th:selected="${filterStatus != null && filterStatus == true}">Active</option>
              <option value="false" th:selected="${filterStatus != null && filterStatus == false}">Inactive</option>
            </select>
          </div>
          <button type="submit" class="btn btn-primary mb-2 mr-2">
            <i class="fas fa-search"></i> Search
          </button>
          <a th:href="@{/admin/bank-accounts}" class="btn btn-secondary mb-2">
            <i class="fas fa-undo"></i> Reset
          </a>
        </form>
      </div>
    </div>

    <!-- Alert Messages -->
    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
      <i class="fas fa-check-circle"></i>
      <span th:text="${successMessage}"></span>
      <button type="button" class="close" data-dismiss="alert" aria-label="Close">
        <span aria-hidden="true">&times;</span>
      </button>
    </div>

    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
      <i class="fas fa-exclamation-triangle"></i>
      <span th:text="${errorMessage}"></span>
      <button type="button" class="close" data-dismiss="alert" aria-label="Close">
        <span aria-hidden="true">&times;</span>
      </button>
    </div>

    <!-- Bank Accounts Table -->
    <div class="row">
      <div class="col-12">
        <div class="card shadow mb-4">
          <div class="card-header py-3">
            <h6 class="m-0 font-weight-bold text-primary">Bank Account List</h6>
          </div>
          <div class="card-body">
            <div th:if="${bankAccounts.empty}" class="text-center py-5">
              <i class="fas fa-university fa-3x text-muted mb-3"></i>
              <p class="text-muted">No bank accounts added yet.</p>
              <a th:href="@{/admin/bank-accounts/create}" class="btn btn-primary">
                <i class="fas fa-plus"></i> Add First Account
              </a>
            </div>

            <div th:unless="${bankAccounts.empty}" class="table-responsive">
              <table class="table table-bordered table-hover" id="bankAccountTable" width="100%" cellspacing="0">
                <thead>
                  <tr class="bg-light">
                    <th>ID</th>
                    <th>Bank</th>
                    <th>Account Number</th>
                    <th>Account Holder</th>
                    <th>Branch</th>
                    <th>SWIFT Code</th>
                    <th>Order</th>
                    <th>Status</th>
                    <th>Actions</th>
                  </tr>
                </thead>
                <tbody>
                  <tr th:each="account : ${bankAccounts}">
                    <td th:text="${account.id}"></td>
                    <td>
                      <strong th:text="${account.bankName}"></strong>
                    </td>
                    <td>
                      <code th:text="${account.accountNumber}"></code>
                    </td>
                    <td th:text="${account.accountHolder}"></td>
                    <td th:text="${account.branch ?: '-'}"></td>
                    <td th:text="${account.swiftCode ?: '-'}"></td>
                    <td>
                      <span class="badge badge-secondary" th:text="${account.displayOrder}"></span>
                    </td>
                    <td>
                      <span th:if="${account.isActive}" class="badge badge-success">
                        <i class="fas fa-check"></i> Active
                      </span>
                      <span th:unless="${account.isActive}" class="badge badge-secondary">
                        <i class="fas fa-times"></i> Inactive
                      </span>
                    </td>
                    <td>
                      <div class="btn-group" role="group">
                        <a th:href="@{/admin/bank-accounts/detail/{id}(id=${account.id})}"
                           class="btn btn-sm btn-info" title="View Details">
                          <i class="fas fa-eye"></i>
                        </a>
                        <a th:href="@{/admin/bank-accounts/edit/{id}(id=${account.id})}"
                           class="btn btn-sm btn-warning" title="Edit">
                          <i class="fas fa-edit"></i>
                        </a>
                        <form th:action="@{/admin/bank-accounts/toggle-status/{id}(id=${account.id})}"
                              method="post" style="display:inline;">
                          <button type="submit" class="btn btn-sm btn-secondary"
                                  th:title="${account.isActive ? 'Deactivate' : 'Activate'}">
                            <i th:class="${account.isActive ? 'fas fa-toggle-on' : 'fas fa-toggle-off'}"></i>
                          </button>
                        </form>
                        <button type="button" class="btn btn-sm btn-danger"
                                data-toggle="modal"
                                th:data-target="'#deleteModal' + ${account.id}"
                                title="Delete">
                          <i class="fas fa-trash"></i>
                        </button>
                      </div>

                      <!-- Delete Confirmation Modal -->
                      <div class="modal fade" th:id="'deleteModal' + ${account.id}" tabindex="-1" role="dialog">
                        <div class="modal-dialog" role="document">
                          <div class="modal-content">
                            <div class="modal-header">
                              <h5 class="modal-title">Confirm Delete</h5>
                              <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                                <span aria-hidden="true">&times;</span>
                              </button>
                            </div>
                            <div class="modal-body">
                              Are you sure you want to delete bank account
                              <strong th:text="${account.bankName} + ' - ' + ${account.accountNumber}"></strong>?
                            </div>
                            <div class="modal-footer">
                              <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancel</button>
                              <form th:action="@{/admin/bank-accounts/delete/{id}(id=${account.id})}"
                                    method="post" style="display:inline;">
                                <button type="submit" class="btn btn-danger">Delete</button>
                              </form>
                            </div>
                          </div>
                        </div>
                      </div>
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>

  </th:block>

  <th:block layout:fragment="custom-scripts">
    <script th:inline="javascript">
      $(document).ready(function() {
        // Initialize DataTable if needed
        if ($('#bankAccountTable').length) {
          $('#bankAccountTable').DataTable({
            "order": [[6, "asc"]], // Sort by display order
            "pageLength": 25,
            "language": {
              "search": "Search:",
              "lengthMenu": "Show _MENU_ entries",
              "info": "Showing _START_ to _END_ of _TOTAL_ entries",
              "paginate": {
                "first": "First",
                "last": "Last",
                "next": "Next",
                "previous": "Previous"
              }
            }
          });
        }
      });
    </script>
  </th:block>

</body>

</html>
