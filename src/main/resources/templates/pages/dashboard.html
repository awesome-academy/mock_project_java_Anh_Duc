<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
 layout:decorate="~{layout/base}">

<head>
 <title>Dashboard - Trang Chính</title>

 <th:block layout:fragment="custom-css">
 </th:block>
</head>

<body>

 <th:block layout:fragment="content">

  <div class="d-sm-flex align-items-center justify-content-between mb-4">
   <h1 class="h3 mb-0 text-gray-800">Dashboard</h1>
  </div>

  <div class="row">
   <div class="col-xl-3 col-md-6 mb-4">
    <div class="card border-left-primary shadow h-100 py-2">
     <div class="card-body">
      <div class="row no-gutters align-items-center">
       <div class="col mr-2">
        <div class="text-xs font-weight-bold text-primary text-uppercase mb-1">
         Total Users</div>
        <div id="totalUsers" class="h5 mb-0 font-weight-bold text-gray-800">0</div>
       </div>
       <div class="col-auto">
        <i class="fas fa-user fa-2x text-gray-300"></i>
       </div>
      </div>
     </div>
    </div>
   </div>
  </div>

  <div class="row">
   <div class="col-xl-12 col-lg-12">
    <div class="card shadow mb-4">
     <!-- Card Header - Dropdown -->
     <div class="card-header py-3 d-flex flex-row align-items-center justify-content-between">
      <h6 class="m-0 font-weight-bold text-primary">Statistics of user count by department</h6>
     </div>

     <!-- Card Body -->
     <div class="card-body">
      <div class="chart-bar">
       <canvas id="departmentChart"></canvas>
      </div>
     </div>
    </div>
   </div>
  </div>

  <div class="row">
   <div class="col-xl-3 col-md-6 mb-4">
   </div>
  </div>

  <div class="row">
   <div class="col-xl-8 col-lg-7">
   </div>

   <div class="col-xl-4 col-lg-5">
   </div>
  </div>

  <div class="row">
   <div class="col-lg-6 mb-4">
   </div>

   <div class="col-lg-6 mb-4">
   </div>
  </div>

 </th:block>

 <th:block layout:fragment="custom-scripts">

 </th:block>

</body>

</html>
