<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layout/base}">

<head>
  <title layout:title-append=" | Tour List"></title>
  <th:block layout:fragment="custom-css">
  </th:block>
</head>

<body>

  <th:block layout:fragment="content">

    <div class="d-sm-flex align-items-center justify-content-between mb-4">
      <h1 class="h3 mb-0 text-gray-800">Tour Management</h1>
      <a th:href="@{/admin/tours/create}" class="btn btn-primary btn-icon-split">
        <span class="icon text-white-50">
          <i class="fas fa-plus"></i>
        </span>
        <span class="text">Add Tour</span>
      </a>
    </div>

    <!-- Search Form -->
    <div class="card shadow mb-4">
      <div class="card-body">
        <form th:action="@{/admin/tours}" method="get" class="form-inline">
          <div class="form-group mr-3 mb-2">
            <label for="keyword" class="mr-2">Search:</label>
            <input type="text" class="form-control" id="keyword" name="keyword" th:value="${keyword}"
              placeholder="Search by name, title, or destination..." style="min-width: 350px;">
          </div>
          <button type="submit" class="btn btn-primary mb-2 mr-2">
            <i class="fas fa-search"></i> Search
          </button>
          <a th:href="@{/admin/tours}" class="btn btn-secondary mb-2">
            <i class="fas fa-undo"></i> Reset
          </a>
        </form>
      </div>
    </div>

    <!-- Alert Messages -->
    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
      <i class="fas fa-check-circle"></i>
      <span th:text="${successMessage}"></span>
      <button type="button" class="close" data-dismiss="alert" aria-label="Close">
        <span aria-hidden="true">&times;</span>
      </button>
    </div>

    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
      <i class="fas fa-exclamation-triangle"></i>
      <span th:text="${errorMessage}"></span>
      <button type="button" class="close" data-dismiss="alert" aria-label="Close">
        <span aria-hidden="true">&times;</span>
      </button>
    </div>

    <div class="row">
      <div class="col-12">
        <div class="card shadow mb-4">
          <div class="card-header py-3">
            <h6 class="m-0 font-weight-bold text-primary">List Tours</h6>
          </div>
          <div class="card-body">
            <div class="table-responsive">
              <table class="table table-bordered table-hover" id="tourTable" width="100%" cellspacing="0">
                <thead>
                  <tr class="bg-light">
                    <th>ID</th>
                    <th>Name</th>
                    <th>Title</th>
                    <th>Category</th>
                    <th>Price</th>
                    <th>Duration</th>
                    <th>Destination</th>
                    <th>Creator</th>
                    <th>Actions</th>
                  </tr>
                </thead>
                <tbody>
                  <tr th:each="tour : ${tours}">
                    <td th:text="${tour.id}"></td>
                    <td th:text="${tour.name}"></td>
                    <td th:text="${tour.title}"></td>
                    <td th:text="${tour.categoryName}"></td>
                    <td>
                      <span th:text="${#numbers.formatDecimal(tour.price, 0, 'COMMA', 0, 'POINT')}"></span>
                      <span th:text="${tour.currency}"></span>
                    </td>
                    <td>
                      <span th:text="${tour.durationDays}"></span> days /
                      <span th:text="${tour.durationNights}"></span> nights
                    </td>
                    <td th:text="${tour.mainDestination}"></td>
                    <td th:text="${tour.creatorUsername}"></td>
                    <td>
                      <a th:href="@{/admin/tours/edit/{id}(id=${tour.id})}" class="btn btn-sm btn-info">
                        <i class="fas fa-edit"></i> Edit
                      </a>

                      <div class="d-inline">
                        <form th:action="@{/admin/tours/delete/{id}(id=${tour.id})}" method="post" class="d-inline"
                          onsubmit="return confirm('Do you want to delete this tour?');">
                          <button type="submit" class="btn btn-sm btn-danger">
                            <i class="fas fa-trash"></i> Delete
                          </button>
                        </form>
                      </div>
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>

            <!-- Empty State -->
            <div th:if="${#lists.isEmpty(tours)}" class="text-center py-5">
              <i class="fas fa-inbox fa-3x text-muted mb-3"></i>
              <p class="text-muted">No tours found.</p>
              <a th:href="@{/admin/tours/create}" class="btn btn-primary">
                <i class="fas fa-plus"></i> Create First Tour
              </a>
            </div>
          </div>
        </div>
      </div>
    </div>

  </th:block>

  <th:block layout:fragment="custom-scripts">
  </th:block>

</body>

</html>
