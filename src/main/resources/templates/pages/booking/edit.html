<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layout/base}">

<head>
  <title layout:title-append=" | Edit Booking"></title>
  <th:block layout:fragment="custom-css">
  </th:block>
</head>

<body>

  <th:block layout:fragment="content">

    <div class="d-sm-flex align-items-center justify-content-between mb-4">
      <h1 class="h3 mb-0 text-gray-800">Edit Booking</h1>
      <a th:href="@{/admin/bookings}" class="btn btn-secondary btn-icon-split">
        <span class="icon text-white-50">
          <i class="fas fa-arrow-left"></i>
        </span>
        <span class="text">Back to List</span>
      </a>
    </div>

    <!-- Alert Messages -->
    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
      <i class="fas fa-check-circle"></i>
      <span th:text="${successMessage}"></span>
      <button type="button" class="close" data-dismiss="alert" aria-label="Close">
        <span aria-hidden="true">&times;</span>
      </button>
    </div>

    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
      <i class="fas fa-exclamation-triangle"></i>
      <span th:text="${errorMessage}"></span>
      <button type="button" class="close" data-dismiss="alert" aria-label="Close">
        <span aria-hidden="true">&times;</span>
      </button>
    </div>

    <!-- Edit Booking Form -->
    <form th:action="@{/admin/bookings/edit/{id}(id=${formEditBookingDTO.id})}" th:object="${formEditBookingDTO}" method="post">

      <!-- Section 1: Basic Information -->
      <div class="card shadow mb-4">
        <div class="card-header py-3 bg-gradient-primary">
          <h6 class="m-0 font-weight-bold text-white">
            <i class="fas fa-info-circle"></i> Basic Information
          </h6>
        </div>
        <div class="card-body">
          <div class="row">
            <div class="col-md-6">
              <!-- Booking Code (Read-only) -->
              <div class="form-group">
                <label for="code" class="font-weight-bold">
                  <i class="fas fa-barcode text-primary"></i> Booking Code
                </label>
                <input type="text" class="form-control" id="code" th:field="*{code}" readonly>
              </div>
            </div>

            <div class="col-md-6">
              <!-- User -->
              <div class="form-group">
                <label for="userId" class="font-weight-bold">
                  <i class="fas fa-user text-primary"></i> User <span class="text-danger">*</span>
                </label>
                <select class="form-control" id="userId" th:field="*{userId}"
                  th:classappend="${#fields.hasErrors('userId')} ? 'is-invalid' : ''">
                  <option value="">Select User</option>
                  <option th:each="user : ${users}" th:value="${user.id}" th:text="${user.username}"></option>
                </select>
                <div class="invalid-feedback" th:if="${#fields.hasErrors('userId')}" th:errors="*{userId}"></div>
              </div>
            </div>
          </div>

          <div class="row">
            <div class="col-md-6">
              <!-- Tour Departure -->
              <div class="form-group">
                <label for="tourDepartureId" class="font-weight-bold">
                  <i class="fas fa-plane-departure text-primary"></i> Tour Departure <span class="text-danger">*</span>
                </label>
                <select class="form-control" id="tourDepartureId" th:field="*{tourDepartureId}"
                  th:classappend="${#fields.hasErrors('tourDepartureId')} ? 'is-invalid' : ''">
                  <option value="">Select Tour Departure</option>
                  <option th:each="departure : ${tourDepartures}"
                          th:value="${departure.id}"
                          th:text="${departure.tour?.name + ' - ' + #temporals.format(departure.departureDate, 'dd/MM/yyyy')}"></option>
                </select>
                <div class="invalid-feedback" th:if="${#fields.hasErrors('tourDepartureId')}" th:errors="*{tourDepartureId}"></div>
              </div>
            </div>

            <div class="col-md-6">
              <!-- Status -->
              <div class="form-group">
                <label for="status" class="font-weight-bold">
                  <i class="fas fa-flag text-primary"></i> Status <span class="text-danger">*</span>
                </label>
                <select class="form-control" id="status" th:field="*{status}"
                  th:classappend="${#fields.hasErrors('status')} ? 'is-invalid' : ''">
                  <option value="">Select Status</option>
                  <option th:each="bookingStatus : ${bookingStatuses}"
                          th:value="${bookingStatus}"
                          th:text="${bookingStatus}"></option>
                </select>
                <div class="invalid-feedback" th:if="${#fields.hasErrors('status')}" th:errors="*{status}"></div>
              </div>
            </div>
          </div>

          <div class="row">
            <div class="col-md-12">
              <!-- Notes -->
              <div class="form-group">
                <label for="notes" class="font-weight-bold">
                  <i class="fas fa-sticky-note text-primary"></i> Notes
                </label>
                <textarea class="form-control" id="notes" th:field="*{notes}" rows="3"
                  placeholder="Additional notes or special requests..."></textarea>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Section 2: Participants -->
      <div class="card shadow mb-4">
        <div class="card-header py-3 bg-gradient-success">
          <h6 class="m-0 font-weight-bold text-white">
            <i class="fas fa-users"></i> Participants
          </h6>
        </div>
        <div class="card-body">
          <div class="row">
            <div class="col-md-6">
              <!-- Number of Adults -->
              <div class="form-group">
                <label for="numAdults" class="font-weight-bold">
                  <i class="fas fa-user text-success"></i> Number of Adults <span class="text-danger">*</span>
                </label>
                <input type="number" class="form-control" id="numAdults" th:field="*{numAdults}" min="0"
                  th:classappend="${#fields.hasErrors('numAdults')} ? 'is-invalid' : ''"
                  placeholder="Enter number of adults">
                <div class="invalid-feedback" th:if="${#fields.hasErrors('numAdults')}" th:errors="*{numAdults}"></div>
              </div>
            </div>

            <div class="col-md-6">
              <!-- Number of Children -->
              <div class="form-group">
                <label for="numChild" class="font-weight-bold">
                  <i class="fas fa-child text-success"></i> Number of Children <span class="text-danger">*</span>
                </label>
                <input type="number" class="form-control" id="numChild" th:field="*{numChild}" min="0"
                  th:classappend="${#fields.hasErrors('numChild')} ? 'is-invalid' : ''"
                  placeholder="Enter number of children">
                <div class="invalid-feedback" th:if="${#fields.hasErrors('numChild')}" th:errors="*{numChild}"></div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Section 3: Pricing -->
      <div class="card shadow mb-4">
        <div class="card-header py-3 bg-gradient-warning">
          <h6 class="m-0 font-weight-bold text-white">
            <i class="fas fa-dollar-sign"></i> Pricing Information
          </h6>
        </div>
        <div class="card-body">
          <div class="row">
            <div class="col-md-4">
              <!-- Sub Total -->
              <div class="form-group">
                <label for="subTotal" class="font-weight-bold">
                  <i class="fas fa-calculator text-warning"></i> Sub Total (VND) <span class="text-danger">*</span>
                </label>
                <input type="number" step="0.01" class="form-control" id="subTotal" th:field="*{subTotal}"
                  th:classappend="${#fields.hasErrors('subTotal')} ? 'is-invalid' : ''"
                  placeholder="Enter sub total">
                <div class="invalid-feedback" th:if="${#fields.hasErrors('subTotal')}" th:errors="*{subTotal}"></div>
              </div>
            </div>

            <div class="col-md-4">
              <!-- Discount -->
              <div class="form-group">
                <label for="discount" class="font-weight-bold">
                  <i class="fas fa-tag text-warning"></i> Discount (VND)
                </label>
                <input type="number" step="0.01" class="form-control" id="discount" th:field="*{discount}"
                  th:classappend="${#fields.hasErrors('discount')} ? 'is-invalid' : ''"
                  placeholder="Enter discount amount">
                <div class="invalid-feedback" th:if="${#fields.hasErrors('discount')}" th:errors="*{discount}"></div>
              </div>
            </div>

            <div class="col-md-4">
              <!-- Final Total -->
              <div class="form-group">
                <label for="finalTotal" class="font-weight-bold">
                  <i class="fas fa-money-bill-wave text-warning"></i> Final Total (VND) <span class="text-danger">*</span>
                </label>
                <input type="number" step="0.01" class="form-control" id="finalTotal" th:field="*{finalTotal}"
                  th:classappend="${#fields.hasErrors('finalTotal')} ? 'is-invalid' : ''"
                  placeholder="Enter final total">
                <div class="invalid-feedback" th:if="${#fields.hasErrors('finalTotal')}" th:errors="*{finalTotal}"></div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Section 4: Contact Information -->
      <div class="card shadow mb-4">
        <div class="card-header py-3 bg-gradient-info">
          <h6 class="m-0 font-weight-bold text-white">
            <i class="fas fa-address-book"></i> Contact Information
          </h6>
        </div>
        <div class="card-body">
          <div class="row">
            <div class="col-md-4">
              <!-- Contact Name -->
              <div class="form-group">
                <label for="contactName" class="font-weight-bold">
                  <i class="fas fa-user text-info"></i> Contact Name <span class="text-danger">*</span>
                </label>
                <input type="text" class="form-control" id="contactName" th:field="*{contactName}"
                  th:classappend="${#fields.hasErrors('contactName')} ? 'is-invalid' : ''"
                  placeholder="Enter contact name">
                <div class="invalid-feedback" th:if="${#fields.hasErrors('contactName')}" th:errors="*{contactName}"></div>
              </div>
            </div>

            <div class="col-md-4">
              <!-- Contact Phone -->
              <div class="form-group">
                <label for="contactPhone" class="font-weight-bold">
                  <i class="fas fa-phone text-info"></i> Contact Phone <span class="text-danger">*</span>
                </label>
                <input type="text" class="form-control" id="contactPhone" th:field="*{contactPhone}"
                  th:classappend="${#fields.hasErrors('contactPhone')} ? 'is-invalid' : ''"
                  placeholder="Enter contact phone">
                <div class="invalid-feedback" th:if="${#fields.hasErrors('contactPhone')}" th:errors="*{contactPhone}"></div>
              </div>
            </div>

            <div class="col-md-4">
              <!-- Contact Email -->
              <div class="form-group">
                <label for="contactEmail" class="font-weight-bold">
                  <i class="fas fa-envelope text-info"></i> Contact Email <span class="text-danger">*</span>
                </label>
                <input type="email" class="form-control" id="contactEmail" th:field="*{contactEmail}"
                  th:classappend="${#fields.hasErrors('contactEmail')} ? 'is-invalid' : ''"
                  placeholder="Enter contact email">
                <div class="invalid-feedback" th:if="${#fields.hasErrors('contactEmail')}" th:errors="*{contactEmail}"></div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Form Actions -->
      <div class="card shadow mb-4">
        <div class="card-body text-right">
          <a th:href="@{/admin/bookings}" class="btn btn-secondary mr-2">
            <i class="fas fa-times"></i> Cancel
          </a>
          <button type="submit" class="btn btn-primary">
            <i class="fas fa-save"></i> Update Booking
          </button>
        </div>
      </div>

    </form>

  </th:block>

  <th:block layout:fragment="custom-scripts">
  </th:block>

</body>

</html>
