<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layout/base}">

<head>
  <title layout:title-append=" | Booking Management"></title>
  <th:block layout:fragment="custom-css">
  </th:block>
</head>

<body>

  <th:block layout:fragment="content">

    <div class="d-sm-flex align-items-center justify-content-between mb-4">
      <h1 class="h3 mb-0 text-gray-800">Booking Management</h1>
      <a th:href="@{/admin/bookings/create}" class="btn btn-primary btn-icon-split">
        <span class="icon text-white-50">
          <i class="fas fa-plus"></i>
        </span>
        <span class="text">Add Booking</span>
      </a>
    </div>

    <!-- Search and Filter Form -->
    <div class="card shadow mb-4">
      <div class="card-body">
        <form th:action="@{/admin/bookings}" method="get" class="form-inline">
          <div class="form-group mr-3 mb-2">
            <label for="keyword" class="mr-2">Search:</label>
            <input type="text" class="form-control" id="keyword" name="keyword" th:value="${keyword}"
              placeholder="Search by code, name, email..." style="min-width: 300px;">
          </div>
          <div class="form-group mr-3 mb-2">
            <label for="status" class="mr-2">Status:</label>
            <select class="form-control" id="status" name="status">
              <option value="">All Status</option>
              <option th:each="bookingStatus : ${bookingStatuses}"
                      th:value="${bookingStatus}"
                      th:text="${bookingStatus}"
                      th:selected="${filterStatus != null && filterStatus == bookingStatus}"></option>
            </select>
          </div>
          <button type="submit" class="btn btn-primary mb-2 mr-2">
            <i class="fas fa-search"></i> Search
          </button>
          <a th:href="@{/admin/bookings}" class="btn btn-secondary mb-2">
            <i class="fas fa-undo"></i> Reset
          </a>
        </form>
      </div>
    </div>

    <!-- Alert Messages -->
    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
      <i class="fas fa-check-circle"></i>
      <span th:text="${successMessage}"></span>
      <button type="button" class="close" data-dismiss="alert" aria-label="Close">
        <span aria-hidden="true">&times;</span>
      </button>
    </div>

    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
      <i class="fas fa-exclamation-triangle"></i>
      <span th:text="${errorMessage}"></span>
      <button type="button" class="close" data-dismiss="alert" aria-label="Close">
        <span aria-hidden="true">&times;</span>
      </button>
    </div>

    <div class="row">
      <div class="col-12">
        <div class="card shadow mb-4">
          <div class="card-header py-3">
            <h6 class="m-0 font-weight-bold text-primary">List Bookings</h6>
          </div>
          <div class="card-body">
            <div class="table-responsive">
              <table class="table table-bordered table-hover" id="bookingTable" width="100%" cellspacing="0">
                <thead>
                  <tr class="bg-light">
                    <th>ID</th>
                    <th>Code</th>
                    <th>User</th>
                    <th>Tour</th>
                    <th>Participants</th>
                    <th>Total Amount</th>
                    <th>Status</th>
                    <th>Contact Info</th>
                    <th>Created At</th>
                    <th>Actions</th>
                  </tr>
                </thead>
                <tbody>
                  <tr th:each="booking : ${bookings}">
                    <td th:text="${booking.id}"></td>
                    <td>
                      <strong th:text="${booking.code}"></strong>
                    </td>
                    <td th:text="${booking.username}"></td>
                    <td th:text="${booking.tourName}"></td>
                    <td>
                      <span class="badge badge-info">
                        <i class="fas fa-user"></i> <span th:text="${booking.numAdults}"></span> Adults
                      </span>
                      <span class="badge badge-secondary">
                        <i class="fas fa-child"></i> <span th:text="${booking.numChild}"></span> Children
                      </span>
                    </td>
                    <td>
                      <strong th:text="${#numbers.formatDecimal(booking.finalTotal, 0, 'COMMA', 0, 'POINT')}"></strong> VND
                    </td>
                    <td>
                      <span th:class="${BookingStatusHelper.getFullBadgeClass(booking.status)}"
                            th:text="${BookingStatusHelper.getDisplayName(booking.status)}"></span>
                    </td>
                    <td>
                      <div>
                        <i class="fas fa-user"></i> <span th:text="${booking.contactName}"></span>
                      </div>
                      <div>
                        <i class="fas fa-phone"></i> <span th:text="${booking.contactPhone}"></span>
                      </div>
                      <div>
                        <i class="fas fa-envelope"></i> <span th:text="${booking.contactEmail}"></span>
                      </div>
                    </td>
                    <td th:text="${#temporals.format(booking.createdAt, 'dd/MM/yyyy HH:mm')}"></td>
                    <td>
                      <a th:href="@{/admin/bookings/detail/{id}(id=${booking.id})}" class="btn btn-sm btn-success mb-1">
                        <i class="fas fa-eye"></i> View
                      </a>
                      <a th:href="@{/admin/bookings/edit/{id}(id=${booking.id})}" class="btn btn-sm btn-info mb-1">
                        <i class="fas fa-edit"></i> Edit
                      </a>
                      <div class="d-inline">
                        <form th:action="@{/admin/bookings/delete/{id}(id=${booking.id})}" method="post" class="d-inline"
                          onsubmit="return confirm('Do you want to delete this booking?');">
                          <button type="submit" class="btn btn-sm btn-danger mb-1">
                            <i class="fas fa-trash"></i> Delete
                          </button>
                        </form>
                      </div>
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>

            <!-- Empty State -->
            <div th:if="${#lists.isEmpty(bookings)}" class="text-center py-5">
              <i class="fas fa-inbox fa-3x text-muted mb-3"></i>
              <p class="text-muted">No bookings found.</p>
              <a th:href="@{/admin/bookings/create}" class="btn btn-primary">
                <i class="fas fa-plus"></i> Create First Booking
              </a>
            </div>
          </div>
        </div>
      </div>
    </div>

  </th:block>

  <th:block layout:fragment="custom-scripts">
  </th:block>

</body>

</html>
